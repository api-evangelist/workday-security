principles:
  - name: Visibility
    description: No public usage API for security calls. Customers rely on the Workday Audit API
      and contract-level reporting to see authentication and security-event volume.
  - name: Allocation
    description: Costs allocate by Workday tenant and product subscription line; per-integration
      attribution requires capturing Integration System User identity in client-side telemetry.
  - name: Optimization
    description: Levers are integration-design choices (token caching, batched audit reads, SSO
      reuse) rather than rate or commitment discounts.
  - name: Accountability
    description: Workday subscription is owned by HR/IT procurement; security-API consumption is
      owned by the integrations and IAM teams that issue OAuth/ISU credentials.
