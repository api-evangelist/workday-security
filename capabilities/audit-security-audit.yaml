naftiko: 1.0.0-alpha2
info:
  label: Workday Security Workday Audit and Compliance API — Security Audit
  description: 'Workday Security Workday Audit and Compliance API — Security Audit. 1 operations. Lead operation: Workday
    Security List security permission changes. Self-contained Naftiko capability covering one Workday Security business surface.'
  tags:
  - Workday Security
  - Security Audit
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_SECURITY_API_KEY: WORKDAY_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: audit-security-audit
    baseUri: https://{host}/ccx/api/v1/{tenant}
    description: Workday Security Workday Audit and Compliance API — Security Audit business capability. Self-contained, no
      shared references.
    resources:
    - name: securityAudit-permissionChanges
      path: /securityAudit/permissionChanges
      operations:
      - name: listpermissionchanges
        method: GET
        description: Workday Security List security permission changes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fromDateTime
          in: query
          type: string
          description: Start of the date range for filtering permission changes
        - name: toDateTime
          in: query
          type: string
          description: End of the date range for filtering permission changes
        - name: changeType
          in: query
          type: string
          description: Filter by the type of permission change
    authentication:
      type: bearer
      token: '{{env.WORKDAY_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: audit-security-audit-rest
    port: 8080
    description: REST adapter for Workday Security Workday Audit and Compliance API — Security Audit. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/securityaudit/permissionchanges
      name: securityaudit-permissionchanges
      description: REST surface for securityAudit-permissionChanges.
      operations:
      - method: GET
        name: listpermissionchanges
        description: Workday Security List security permission changes
        call: audit-security-audit.listpermissionchanges
        with:
          fromDateTime: rest.fromDateTime
          toDateTime: rest.toDateTime
          changeType: rest.changeType
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: audit-security-audit-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Security Workday Audit and Compliance API — Security Audit. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: workday-security-list-security-permission
      description: Workday Security List security permission changes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: audit-security-audit.listpermissionchanges
      with:
        fromDateTime: tools.fromDateTime
        toDateTime: tools.toDateTime
        changeType: tools.changeType
      outputParameters:
      - type: object
        mapping: $.
