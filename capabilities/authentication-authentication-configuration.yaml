naftiko: 1.0.0-alpha2
info:
  label: Workday Security Workday Authentication API — Authentication Configuration
  description: 'Workday Security Workday Authentication API — Authentication Configuration. 1 operations. Lead operation:
    Workday Security List authentication policies. Self-contained Naftiko capability covering one Workday Security business
    surface.'
  tags:
  - Workday Security
  - Authentication Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_SECURITY_API_KEY: WORKDAY_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: authentication-authentication-configuration
    baseUri: https://{host}/ccx
    description: Workday Security Workday Authentication API — Authentication Configuration business capability. Self-contained,
      no shared references.
    resources:
    - name: api-v1-tenant-authenticationPolicies
      path: /api/v1/{tenant}/authenticationPolicies
      operations:
      - name: listauthenticationpolicies
        method: GET
        description: Workday Security List authentication policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WORKDAY_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: authentication-authentication-configuration-rest
    port: 8080
    description: REST adapter for Workday Security Workday Authentication API — Authentication Configuration. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/v1/{tenant}/authenticationpolicies
      name: api-v1-tenant-authenticationpolicies
      description: REST surface for api-v1-tenant-authenticationPolicies.
      operations:
      - method: GET
        name: listauthenticationpolicies
        description: Workday Security List authentication policies
        call: authentication-authentication-configuration.listauthenticationpolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: authentication-authentication-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Security Workday Authentication API — Authentication Configuration. One tool per
      consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: workday-security-list-authentication-policies
      description: Workday Security List authentication policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: authentication-authentication-configuration.listauthenticationpolicies
      outputParameters:
      - type: object
        mapping: $.
