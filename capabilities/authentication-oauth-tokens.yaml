naftiko: 1.0.0-alpha2
info:
  label: Workday Security Workday Authentication API — OAuth Tokens
  description: 'Workday Security Workday Authentication API — OAuth Tokens. 1 operations. Lead operation: Workday Security
    Request an OAuth 2.0 access token. Self-contained Naftiko capability covering one Workday Security business surface.'
  tags:
  - Workday Security
  - OAuth Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_SECURITY_API_KEY: WORKDAY_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: authentication-oauth-tokens
    baseUri: https://{host}/ccx
    description: Workday Security Workday Authentication API — OAuth Tokens business capability. Self-contained, no shared
      references.
    resources:
    - name: oauth2-tenant-token
      path: /oauth2/{tenant}/token
      operations:
      - name: requestaccesstoken
        method: POST
        description: Workday Security Request an OAuth 2.0 access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: authentication-oauth-tokens-rest
    port: 8080
    description: REST adapter for Workday Security Workday Authentication API — OAuth Tokens. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/oauth2/{tenant}/token
      name: oauth2-tenant-token
      description: REST surface for oauth2-tenant-token.
      operations:
      - method: POST
        name: requestaccesstoken
        description: Workday Security Request an OAuth 2.0 access token
        call: authentication-oauth-tokens.requestaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: authentication-oauth-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Security Workday Authentication API — OAuth Tokens. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-security-request-oauth-2-0
      description: Workday Security Request an OAuth 2.0 access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: authentication-oauth-tokens.requestaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
