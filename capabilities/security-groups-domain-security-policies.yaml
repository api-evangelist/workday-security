naftiko: 1.0.0-alpha2
info:
  label: Workday Security Groups API — Domain Security Policies
  description: 'Workday Security Groups API — Domain Security Policies. 2 operations. Lead operation: Workday Security List
    domain security policies. Self-contained Naftiko capability covering one Workday Security business surface.'
  tags:
  - Workday Security
  - Domain Security Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_SECURITY_API_KEY: WORKDAY_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: security-groups-domain-security-policies
    baseUri: https://{host}/ccx/api/v1/{tenant}
    description: Workday Security Groups API — Domain Security Policies business capability. Self-contained, no shared references.
    resources:
    - name: domainSecurityPolicies
      path: /domainSecurityPolicies
      operations:
      - name: listdomainsecuritypolicies
        method: GET
        description: Workday Security List domain security policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: query
          type: string
          description: Filter by Workday domain name
        - name: search
          in: query
          type: string
          description: Search term to filter policies by domain name or description
    - name: domainSecurityPolicies-policyId
      path: /domainSecurityPolicies/{policyId}
      operations:
      - name: getdomainsecuritypolicy
        method: GET
        description: Workday Security Get a specific domain security policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policyId
          in: path
          type: string
          description: Unique identifier of the domain security policy
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: security-groups-domain-security-policies-rest
    port: 8080
    description: REST adapter for Workday Security Groups API — Domain Security Policies. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/domainsecuritypolicies
      name: domainsecuritypolicies
      description: REST surface for domainSecurityPolicies.
      operations:
      - method: GET
        name: listdomainsecuritypolicies
        description: Workday Security List domain security policies
        call: security-groups-domain-security-policies.listdomainsecuritypolicies
        with:
          domain: rest.domain
          search: rest.search
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/domainsecuritypolicies/{policyid}
      name: domainsecuritypolicies-policyid
      description: REST surface for domainSecurityPolicies-policyId.
      operations:
      - method: GET
        name: getdomainsecuritypolicy
        description: Workday Security Get a specific domain security policy
        call: security-groups-domain-security-policies.getdomainsecuritypolicy
        with:
          policyId: rest.policyId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: security-groups-domain-security-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Security Groups API — Domain Security Policies. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-security-list-domain-security
      description: Workday Security List domain security policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: security-groups-domain-security-policies.listdomainsecuritypolicies
      with:
        domain: tools.domain
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
    - name: workday-security-get-specific-domain
      description: Workday Security Get a specific domain security policy
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: security-groups-domain-security-policies.getdomainsecuritypolicy
      with:
        policyId: tools.policyId
      outputParameters:
      - type: object
        mapping: $.
