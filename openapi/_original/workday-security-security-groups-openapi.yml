openapi: 3.1.0
info:
  title: Workday Security Groups API
  description: >-
    Manage security groups, domain security policies, and security group
    memberships within the Workday platform. Security groups control access to
    securable items within Workday domains and business processes. This API
    provides operations for creating, retrieving, and managing Integration
    System Security Groups, role-based security groups, and domain security
    policy permission assignments.
  version: v1
  contact:
    name: Workday Support
    url: https://community.workday.com
    email: support@workday.com
  termsOfService: https://www.workday.com/en-us/legal.html
externalDocs:
  description: Workday Security Groups API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/Security/v44.0/Security_Groups.html
servers:
  - url: https://{host}/ccx/api/v1/{tenant}
    description: Workday REST API Server
    variables:
      host:
        description: Workday host for your tenant environment
        default: wd2-impl-services1.workday.com
      tenant:
        description: Workday tenant identifier
        default: your-tenant
tags:
  - name: Domain Security Policies
    description: >-
      Manage domain security policies that define which security groups have
      access to specific Workday functional domains and the permission levels
      granted.
  - name: Security Group Members
    description: >-
      Manage the membership of users and integration system users within
      security groups.
  - name: Security Groups
    description: >-
      Create, retrieve, and manage security groups that control access to
      Workday domains, business processes, and securable items.
security:
  - bearerAuth: []
paths:
  /securityGroups:
    get:
      operationId: listSecurityGroups
      summary: Workday Security List security groups
      description: >-
        Retrieve a collection of security groups configured in the Workday
        tenant. Supports filtering by security group type, status, and search
        terms. Returns security group metadata including type, membership count,
        and associated domain security policies.
      tags:
        - Security Groups
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: type
          in: query
          description: Filter by security group type
          schema:
            type: string
            enum:
              - Integration_System
              - Role_Based
              - User_Based
              - Job_Based
              - Unconstrained
              - Constrained
              - Intersection
              - Aggregation
        - name: search
          in: query
          description: >-
            Search term to filter security groups by name or description
          schema:
            type: string
        - name: inactive
          in: query
          description: Include inactive security groups in the results
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Collection of security groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityGroup'
                  total:
                    type: integer
                    description: Total number of security groups matching the criteria
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /securityGroups/{securityGroupId}:
    get:
      operationId: getSecurityGroup
      summary: Workday Security Get a specific security group
      description: >-
        Retrieve detailed information about a specific security group including
        its type, members, and associated domain security policies.
      tags:
        - Security Groups
      parameters:
        - name: securityGroupId
          in: path
          required: true
          description: Unique identifier of the security group
          schema:
            type: string
      responses:
        '200':
          description: Security group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroup'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Security group not found
  /securityGroups/{securityGroupId}/members:
    get:
      operationId: listSecurityGroupMembers
      summary: Workday Security List members of a security group
      description: >-
        Retrieve the collection of users and integration system users that are
        members of the specified security group. Returns member details
        including account information and assignment metadata.
      tags:
        - Security Group Members
      parameters:
        - name: securityGroupId
          in: path
          required: true
          description: Unique identifier of the security group
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Collection of security group members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityGroupMember'
                  total:
                    type: integer
                    description: Total number of members in the security group
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Security group not found
  /domainSecurityPolicies:
    get:
      operationId: listDomainSecurityPolicies
      summary: Workday Security List domain security policies
      description: >-
        Retrieve a collection of domain security policies configured in the
        Workday tenant. Domain security policies define which security groups
        have access to specific Workday functional domains and what level of
        access is granted, such as View or Modify permissions.
      tags:
        - Domain Security Policies
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: domain
          in: query
          description: Filter by Workday domain name
          schema:
            type: string
        - name: search
          in: query
          description: >-
            Search term to filter policies by domain name or description
          schema:
            type: string
      responses:
        '200':
          description: Collection of domain security policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainSecurityPolicy'
                  total:
                    type: integer
                    description: Total number of domain security policies
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /domainSecurityPolicies/{policyId}:
    get:
      operationId: getDomainSecurityPolicy
      summary: Workday Security Get a specific domain security policy
      description: >-
        Retrieve detailed information about a specific domain security policy
        including the security groups with access and their permission levels.
      tags:
        - Domain Security Policies
      parameters:
        - name: policyId
          in: path
          required: true
          description: Unique identifier of the domain security policy
          schema:
            type: string
      responses:
        '200':
          description: Domain security policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSecurityPolicy'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Domain security policy not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth 2.0 bearer token obtained from the Workday token endpoint.
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    SecurityGroup:
      type: object
      description: >-
        A security group that controls access to securable items within Workday
        domains and business processes. Security groups can be role-based,
        user-based, integration system-based, or derived from job or
        organizational criteria.
      properties:
        id:
          type: string
          description: Unique identifier for the security group
        descriptor:
          type: string
          description: Human-readable name of the security group
        type:
          type: string
          enum:
            - Integration_System
            - Role_Based
            - User_Based
            - Job_Based
            - Unconstrained
            - Constrained
            - Intersection
            - Aggregation
          description: >-
            Classification of the security group that determines how membership
            is derived and managed
        description:
          type: string
          description: Detailed description of the security group purpose
        inactive:
          type: boolean
          description: Whether the security group is currently inactive
        memberCount:
          type: integer
          minimum: 0
          description: Number of members currently in the security group
        domainPolicies:
          type: array
          items:
            $ref: '#/components/schemas/DomainSecurityPolicyRef'
          description: >-
            Domain security policies associated with this security group
        createdOn:
          type: string
          format: date-time
          description: Timestamp when the security group was created
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the security group was last modified
    SecurityGroupMember:
      type: object
      description: >-
        A member of a security group, which can be a user account or an
        integration system user that has been assigned to the group.
      properties:
        id:
          type: string
          description: Unique identifier of the membership assignment
        account:
          $ref: '#/components/schemas/AccountRef'
        assignedOn:
          type: string
          format: date-time
          description: Timestamp when the member was assigned to the security group
        assignedBy:
          type: string
          description: The account that assigned this member to the group
    DomainSecurityPolicy:
      type: object
      description: >-
        A domain security policy that defines access permissions for a specific
        Workday functional domain. Specifies which security groups can view or
        modify resources within the domain.
      properties:
        id:
          type: string
          description: Unique identifier for the domain security policy
        descriptor:
          type: string
          description: Human-readable name of the domain security policy
        domain:
          type: string
          description: The Workday functional domain this policy governs
        description:
          type: string
          description: Detailed description of the policy and its scope
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPermission'
          description: >-
            List of permission assignments defining which security groups have
            access and at what level
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the policy was last modified
    PolicyPermission:
      type: object
      description: >-
        A permission assignment within a domain security policy that grants a
        specific security group a level of access to the domain.
      properties:
        securityGroup:
          $ref: '#/components/schemas/SecurityGroupRef'
        accessLevel:
          type: string
          enum:
            - View
            - Modify
            - Get
            - Put
          description: >-
            Level of access granted to the security group for this domain
    DomainSecurityPolicyRef:
      type: object
      description: Reference to a domain security policy
      properties:
        id:
          type: string
          description: Unique identifier of the domain security policy
        descriptor:
          type: string
          description: Display name of the domain security policy
        href:
          type: string
          format: uri
          description: API URL for the domain security policy resource
    SecurityGroupRef:
      type: object
      description: Reference to a security group
      properties:
        id:
          type: string
          description: Unique identifier of the security group
        descriptor:
          type: string
          description: Display name of the security group
        href:
          type: string
          format: uri
          description: API URL for the security group resource
    AccountRef:
      type: object
      description: Reference to a Workday user account
      properties:
        id:
          type: string
          description: Unique identifier of the user account
        descriptor:
          type: string
          description: Display name of the user account
        href:
          type: string
          format: uri
          description: API URL for the user account resource
