openapi: 3.1.0
info:
  title: Workday Security Workday Authentication API
  description: >-
    Manage authentication methods, single sign-on configuration, and session
    management within the Workday platform. Supports OAuth 2.0 token-based
    authentication for REST API access including client registration, token
    issuance, and token refresh workflows. Provides endpoints for obtaining
    access tokens using authorization codes and refresh tokens, as well as
    managing API client registrations and scopes.
  version: v1
  contact:
    name: Workday Support
    url: https://community.workday.com
    email: support@workday.com
  termsOfService: https://www.workday.com/en-us/legal.html
externalDocs:
  description: Workday Authentication API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/Security/v44.0/Authentication.html
servers:
  - url: https://{host}/ccx
    description: Workday Production Server
    variables:
      host:
        description: Workday host for your tenant environment
        default: wd2-impl-services1.workday.com
  - url: https://{host}/ccx/oauth2/{tenant}
    description: Workday OAuth 2.0 Token Server
    variables:
      host:
        description: Workday host for your tenant environment
        default: wd2-impl-services1.workday.com
      tenant:
        description: Workday tenant identifier
        default: your-tenant
tags:
  - name: Authentication Configuration
    description: >-
      Manage authentication policies and configurations including SSO, SAML,
      and multi-factor authentication settings.
  - name: OAuth Tokens
    description: >-
      Obtain and manage OAuth 2.0 access tokens for authenticating REST API
      requests to Workday services.
  - name: Sessions
    description: >-
      Retrieve and manage active authentication sessions including signon
      history and session metadata.
security:
  - bearerAuth: []
paths:
  /oauth2/{tenant}/token:
    post:
      operationId: requestAccessToken
      summary: Workday Security Request an OAuth 2.0 access token
      description: >-
        Exchange an authorization code or refresh token for a new access token.
        The token endpoint accepts client credentials and either an authorization
        code or refresh token to issue a new bearer token for authenticating
        subsequent REST API requests.
      tags:
        - OAuth Tokens
      security: []
      parameters:
        - $ref: '#/components/parameters/tenant'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                  description: >-
                    The OAuth 2.0 grant type. Use authorization_code for initial
                    token requests and refresh_token to renew expired tokens.
                client_id:
                  type: string
                  description: >-
                    The client identifier issued during API client registration
                    in Workday.
                client_secret:
                  type: string
                  description: >-
                    The client secret issued during API client registration.
                code:
                  type: string
                  description: >-
                    The authorization code received from the authorization
                    endpoint. Required when grant_type is authorization_code.
                redirect_uri:
                  type: string
                  format: uri
                  description: >-
                    The redirect URI registered with the API client. Required
                    when grant_type is authorization_code.
                refresh_token:
                  type: string
                  description: >-
                    The refresh token issued during a previous token request.
                    Required when grant_type is refresh_token.
      responses:
        '200':
          description: Access token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request parameters or unsupported grant type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /api/v1/{tenant}/sessions:
    get:
      operationId: listActiveSessions
      summary: Workday Security List active sessions
      description: >-
        Retrieve a collection of currently active authentication sessions for the
        tenant. Returns session metadata including signon timestamps, IP
        addresses, device information, and authentication methods used.
      tags:
        - Sessions
      parameters:
        - $ref: '#/components/parameters/tenant'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Collection of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  total:
                    type: integer
                    description: Total number of active sessions
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /api/v1/{tenant}/authenticationPolicies:
    get:
      operationId: listAuthenticationPolicies
      summary: Workday Security List authentication policies
      description: >-
        Retrieve the collection of authentication policies configured for the
        tenant, including SSO settings, multi-factor authentication requirements,
        and password policies.
      tags:
        - Authentication Configuration
      parameters:
        - $ref: '#/components/parameters/tenant'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Collection of authentication policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthenticationPolicy'
                  total:
                    type: integer
                    description: Total number of authentication policies
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth 2.0 bearer token obtained from the token endpoint. Tokens are
        issued after authentication through the Workday authorization server.
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 authorization code flow for obtaining access tokens to
        Workday REST APIs.
      flows:
        authorizationCode:
          authorizationUrl: https://{host}/authorize
          tokenUrl: https://{host}/ccx/oauth2/{tenant}/token
          scopes:
            System: Access to system-level resources
            Integration: Access to integration resources
            Tenant_Non-Configurable: Access to tenant non-configurable resources
  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      description: Workday tenant identifier
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results to return per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    TokenResponse:
      type: object
      description: >-
        OAuth 2.0 token response containing the access token and associated
        metadata for authenticating subsequent API requests.
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The bearer access token for authenticating API requests
        token_type:
          type: string
          enum:
            - Bearer
          description: The type of token issued
        expires_in:
          type: integer
          description: The lifetime of the access token in seconds
        refresh_token:
          type: string
          description: >-
            A non-expiring refresh token that can be used to obtain new access
            tokens without requiring re-authorization.
        scope:
          type: string
          description: >-
            Space-delimited list of scopes granted to the access token
    OAuthError:
      type: object
      description: >-
        Error response returned when an OAuth 2.0 token request fails due to
        invalid parameters, credentials, or an unsupported grant type.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
          description: OAuth 2.0 error code
        error_description:
          type: string
          description: Human-readable description of the error
    Session:
      type: object
      description: >-
        Represents an active authentication session within the Workday tenant,
        including details about the signon event, device, and session lifetime.
      properties:
        id:
          type: string
          description: Unique session identifier
        sessionId:
          type: string
          description: Workday-assigned session identifier
        systemAccount:
          type: string
          description: >-
            The system account or username associated with the session
        signonDateTime:
          type: string
          format: date-time
          description: Timestamp when the signon occurred
        sessionStart:
          type: string
          format: date-time
          description: Timestamp when the session started
        sessionEnd:
          type: string
          format: date-time
          description: Timestamp when the session ended or will expire
        ipAddress:
          type: string
          description: IP address from which the signon originated
        authenticationType:
          type: string
          description: >-
            Authentication method used for the signon such as SAML, password,
            or OAuth
        browserType:
          type: string
          description: Browser type used for the signon
        deviceType:
          type: string
          description: Device type from which the signon was made
        deviceIsTrusted:
          type: boolean
          description: Whether the device is registered as a trusted device
        isDeviceManaged:
          type: boolean
          description: Whether the device is managed by the organization
        isFailed:
          type: boolean
          description: Whether the signon attempt was unsuccessful
        multiFactorType:
          type: string
          description: >-
            Multi-factor authentication type used if applicable
    AuthenticationPolicy:
      type: object
      description: >-
        An authentication policy that defines the rules and requirements for
        authenticating users, including SSO configuration, password policies,
        and multi-factor authentication requirements.
      properties:
        id:
          type: string
          description: Unique identifier for the authentication policy
        descriptor:
          type: string
          description: Human-readable name of the authentication policy
        ssoEnabled:
          type: boolean
          description: Whether single sign-on is enabled for this policy
        samlIdentityProvider:
          type: string
          description: >-
            The SAML identity provider configured for SSO authentication
        mfaRequired:
          type: boolean
          description: >-
            Whether multi-factor authentication is required
        passwordPolicyEnabled:
          type: boolean
          description: Whether a custom password policy is enforced
        sessionTimeoutMinutes:
          type: integer
          minimum: 1
          description: >-
            Session timeout duration in minutes before re-authentication is
            required
        allowedAuthenticationTypes:
          type: array
          items:
            type: string
          description: >-
            List of authentication methods permitted under this policy
