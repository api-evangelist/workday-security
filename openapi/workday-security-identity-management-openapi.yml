openapi: 3.1.0
info:
  title: Workday Security Workday Identity Management API
  description: >-
    Manage user identities, Workday account signons, and access permissions
    within the Workday platform. Provides operations for tracking authenticated
    signon activity, identifying unauthorized authentication attempts, and
    managing user account credentials. This API includes both SOAP and REST
    interfaces for retrieving signon history and monitoring identity-related
    security events.
  version: v1
  contact:
    name: Workday Support
    url: https://community.workday.com
    email: support@workday.com
  termsOfService: https://www.workday.com/en-us/legal.html
externalDocs:
  description: Workday Identity Management API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/Identity_Management/v45.2/Identity_Management.html
servers:
  - url: https://{host}/ccx/api/v1/{tenant}
    description: Workday REST API Server
    variables:
      host:
        description: Workday host for your tenant environment
        default: wd2-impl-services1.workday.com
      tenant:
        description: Workday tenant identifier
        default: your-tenant
  - url: https://{host}/ccx/service/{tenant}
    description: Workday SOAP API Server
    variables:
      host:
        description: Workday host for your tenant environment
        default: wd2-impl-services1.workday.com
      tenant:
        description: Workday tenant identifier
        default: your-tenant
tags:
  - name: Account Signons
    description: >-
      Retrieve and monitor Workday account signon events where the username
      corresponds to a valid Workday account. Provides detailed signon history
      including timestamps, IP addresses, and authentication methods.
  - name: Unidentified Signons
    description: >-
      Retrieve and monitor unidentified signon attempts where the provided
      username does not correspond to a valid Workday account. Used for
      detecting potential unauthorized access attempts.
  - name: User Accounts
    description: >-
      Manage Workday user accounts including account status, credentials,
      and associated security configurations.
security:
  - bearerAuth: []
paths:
  /accountSignons:
    get:
      operationId: listAccountSignons
      summary: Workday Security List Workday account signons
      description: >-
        Retrieve a collection of signon events for valid Workday accounts.
        Returns detailed records of authentication events including the signon
        timestamp, IP address, authentication type, and the associated Workday
        account. The time range specified in the request criteria must be less
        than 24 hours. This operation excludes signon attempts where an
        unidentified or invalid username was provided.
      tags:
        - Account Signons
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: fromDateTime
          in: query
          required: true
          description: >-
            Start of the time range for retrieving signons. The range between
            fromDateTime and toDateTime must be less than 24 hours.
          schema:
            type: string
            format: date-time
        - name: toDateTime
          in: query
          required: true
          description: >-
            End of the time range for retrieving signons. The range between
            fromDateTime and toDateTime must be less than 24 hours.
          schema:
            type: string
            format: date-time
        - name: systemAccount
          in: query
          description: Filter signons by the system account username
          schema:
            type: string
        - name: successful
          in: query
          description: >-
            Filter by signon success status. Set to true for successful signons
            only or false for failed signons only.
          schema:
            type: boolean
      responses:
        '200':
          description: Collection of account signon events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSignon'
                  total:
                    type: integer
                    description: Total number of signon events matching the criteria
        '400':
          description: >-
            Invalid request. The time range exceeds 24 hours or required
            parameters are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /accountSignons/{signonId}:
    get:
      operationId: getAccountSignon
      summary: Workday Security Get a specific account signon
      description: >-
        Retrieve detailed information about a specific signon event identified
        by its unique signon identifier. Returns the full signon record
        including timestamps, IP address, device information, and authentication
        method.
      tags:
        - Account Signons
      parameters:
        - name: signonId
          in: path
          required: true
          description: Unique identifier of the signon event
          schema:
            type: string
      responses:
        '200':
          description: Signon event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSignon'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: Signon event not found
  /unidentifiedSignons:
    get:
      operationId: listUnidentifiedSignons
      summary: Workday Security List unidentified signon attempts
      description: >-
        Retrieve a collection of unidentified signon attempts where the
        provided username does not correspond to a valid Workday account.
        Used for detecting potential unauthorized access attempts and monitoring
        security threats. The time range specified in the request criteria must
        be less than 24 hours.
      tags:
        - Unidentified Signons
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: fromDateTime
          in: query
          required: true
          description: >-
            Start of the time range for retrieving unidentified signons. The
            range between fromDateTime and toDateTime must be less than 24 hours.
          schema:
            type: string
            format: date-time
        - name: toDateTime
          in: query
          required: true
          description: >-
            End of the time range for retrieving unidentified signons. The
            range between fromDateTime and toDateTime must be less than 24 hours.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Collection of unidentified signon attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnidentifiedSignon'
                  total:
                    type: integer
                    description: >-
                      Total number of unidentified signon attempts matching
                      the criteria
        '400':
          description: >-
            Invalid request. The time range exceeds 24 hours or required
            parameters are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /userAccounts:
    get:
      operationId: listUserAccounts
      summary: Workday Security List user accounts
      description: >-
        Retrieve a collection of Workday user accounts including their account
        status, associated worker, and security configuration. Supports
        filtering by account status and search terms.
      tags:
        - User Accounts
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: accountStatus
          in: query
          description: Filter by account status
          schema:
            type: string
            enum:
              - Active
              - Disabled
              - Locked
              - Expired
        - name: search
          in: query
          description: Search term to filter user accounts by username or display name
          schema:
            type: string
      responses:
        '200':
          description: Collection of user accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAccount'
                  total:
                    type: integer
                    description: Total number of user accounts
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
  /userAccounts/{accountId}:
    get:
      operationId: getUserAccount
      summary: Workday Security Get a specific user account
      description: >-
        Retrieve detailed information about a specific Workday user account
        including account status, associated security groups, and last signon
        information.
      tags:
        - User Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the user account
          schema:
            type: string
      responses:
        '200':
          description: User account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          description: Unauthorized - invalid or expired access token
        '403':
          description: Forbidden - insufficient permissions
        '404':
          description: User account not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth 2.0 bearer token obtained from the Workday token endpoint.
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of results to return per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0
  schemas:
    AccountSignon:
      type: object
      description: >-
        A signon event recorded when a user authenticates with a valid Workday
        account. Contains details about the authentication including timestamps,
        IP address, device information, and the outcome of the signon attempt.
      properties:
        id:
          type: string
          description: Unique identifier for the signon event
        systemAccount:
          type: string
          description: The Workday system account username used for the signon
        signonDateTime:
          type: string
          format: date-time
          description: Timestamp when the signon occurred
        ipAddress:
          type: string
          description: IP address from which the signon attempt originated
        authenticationType:
          type: string
          description: >-
            Authentication method used such as SAML, password, or certificate
        browserType:
          type: string
          description: Browser type used for the signon
        operatingSystem:
          type: string
          description: Operating system of the device used for the signon
        deviceType:
          type: string
          description: Type of device used for the signon
        deviceIsTrusted:
          type: boolean
          description: Whether the device is registered as a trusted device
        isDeviceManaged:
          type: boolean
          description: Whether the device is managed by the organization
        sessionId:
          type: string
          description: Session identifier assigned to the signon
        sessionStart:
          type: string
          format: date-time
          description: Timestamp when the session started
        sessionEnd:
          type: string
          format: date-time
          description: Timestamp when the session ended
        successful:
          type: boolean
          description: Whether the signon attempt was successful
        failedSignonReason:
          type: string
          description: >-
            Reason for the signon failure if the attempt was unsuccessful
        passwordChanged:
          type: boolean
          description: Whether the password was changed during this signon
        forgottenPasswordResetRequest:
          type: boolean
          description: Whether a forgotten password reset was requested
        multiFactorType:
          type: string
          description: >-
            Multi-factor authentication type used if applicable
        samlIdentityProvider:
          type: string
          description: >-
            SAML identity provider used if the signon was via SSO
        uiClientType:
          type: string
          description: >-
            Workday UI client type used for the signon
        requestOriginator:
          type: string
          description: >-
            Originator of the signon request such as user-initiated or
            system-initiated
    UnidentifiedSignon:
      type: object
      description: >-
        An unidentified signon attempt where the provided username does not
        correspond to any valid Workday account. These records are used for
        monitoring potential unauthorized access attempts.
      properties:
        id:
          type: string
          description: Unique identifier for the unidentified signon event
        attemptedUsername:
          type: string
          description: >-
            The username that was provided during the signon attempt but did
            not match any valid Workday account
        signonDateTime:
          type: string
          format: date-time
          description: Timestamp when the signon attempt occurred
        ipAddress:
          type: string
          description: IP address from which the signon attempt originated
        browserType:
          type: string
          description: Browser type used for the signon attempt
        operatingSystem:
          type: string
          description: Operating system of the device used for the signon attempt
        deviceType:
          type: string
          description: Type of device used for the signon attempt
    UserAccount:
      type: object
      description: >-
        A Workday user account representing a person or system that can
        authenticate to the Workday platform. Contains account credentials,
        status, and associated security configuration.
      properties:
        id:
          type: string
          description: Unique identifier for the user account
        descriptor:
          type: string
          description: Display name of the user account
        userName:
          type: string
          description: The username used for authentication
        accountStatus:
          type: string
          enum:
            - Active
            - Disabled
            - Locked
            - Expired
          description: Current status of the user account
        accountType:
          type: string
          enum:
            - User
            - IntegrationSystemUser
          description: >-
            Type of account indicating whether it is a regular user account or
            an integration system user account
        lastSignonDateTime:
          type: string
          format: date-time
          description: Timestamp of the most recent successful signon
        accountExpirationDate:
          type: string
          format: date
          description: >-
            Date when the account is set to expire if an expiration is configured
        passwordExpirationDate:
          type: string
          format: date
          description: Date when the current password will expire
        mfaEnabled:
          type: boolean
          description: >-
            Whether multi-factor authentication is enabled for this account
        worker:
          $ref: '#/components/schemas/WorkerRef'
    WorkerRef:
      type: object
      description: >-
        Reference to a Workday worker associated with a user account
      properties:
        id:
          type: string
          description: Unique identifier of the worker
        descriptor:
          type: string
          description: Display name of the worker
        href:
          type: string
          format: uri
          description: API URL for the worker resource
    Error:
      type: object
      description: >-
        Error response returned when an API request fails due to invalid
        parameters or business rule violations.
      properties:
        error:
          type: string
          description: Error code identifying the type of error
        message:
          type: string
          description: Human-readable description of the error
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error
              message:
                type: string
                description: Description of the field-level error
