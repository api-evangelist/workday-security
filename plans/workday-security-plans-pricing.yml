specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Workday Security
providerId: workday-security
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Identity
  - Security
  - Authentication
  - Audit
  - Workday
description: Workday Security APIs (Authentication, Identity, Security Groups, Audit, Privacy,
  User Activity) are provisioned with a Workday tenant subscription. Workday does not publish list
  pricing, free, or self-serve API plans; all commercial terms are negotiated via direct sales.
sources:
  - https://www.workday.com/en-us/why-workday/about-us/contact-us.html
  - https://community.workday.com/api
notes: Workday public pricing pages return 404 and the Workday Community API reference is gated
  behind authenticated customer access. No tier or per-call pricing is publicly disclosed.
  Trimmed to a single Contact Sales plan pending direct vendor confirmation.
plans:
  - id: workday-security-contact-sales
    name: Contact Sales
    type: enterprise
    description: Enterprise-only commercial terms negotiated as part of a Workday tenant
      subscription. Security API access is included with the underlying Workday product
      subscription; no separate API price list is published.
    entries:
      - label: Workday tenant subscription
        name: tenant_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Workday Authentication API
      - name: Workday Identity Management API
      - name: Workday Security Groups API
      - name: Workday Audit API
      - name: Workday Privacy API
      - name: Workday User Activity API
