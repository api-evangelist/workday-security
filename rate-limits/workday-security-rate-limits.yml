reconciled: false
tags:
  - Rate Limiting
  - Security
  - Authentication
  - Workday
description: Workday does not publish a unified, public rate-limit policy for the Authentication,
  Identity, Security Groups, Audit, Privacy, or User Activity APIs. Documentation lives on
  community.workday.com behind customer authentication. Throttling is tenant-scoped.
sources:
  - https://community.workday.com/api
  - https://community.workday.com/sites/default/files/file-hosting/productionapi/Security/v44.0/Authentication.html
responseCodes:
  serviceUnavailable: 503
limits:
  - name: Tenant-scoped throttling (see gated Workday Community documentation)
    scope: tenant
    metric: varies
    limit: see https://community.workday.com/api
    notes: Workday enforces tenant-level throttling and OAuth token-issuance rate limits; specific
      values are published only inside the authenticated Workday Community reference.
policies:
  - name: Documentation gating
    description: Workday API rate-limit policy is published only on community.workday.com, which
      requires a customer login. No public per-second or per-minute numbers are available.
  - name: Backoff
    description: Standard guidance is exponential backoff with jitter on HTTP 503 and on documented
      Workday throttling SOAP faults.
  - name: Token issuance
    description: OAuth token issuance and SAML assertion exchange have separate, tenant-bound rate
      limits documented inside the gated Authentication API reference.
